[package]
name = "vexdesk"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native Windows viewer for gliff: a winit window over the portable protocol and the CPU decoder"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
gliff-proto.workspace = true
gliff-transport.workspace = true
gliff-sw.workspace = true
# X11 only on Linux. Their default `wayland-dlopen` would, through workspace
# feature unification, switch every gliff crate's wayland-client to libwayland
# opened with dlopen, which the Nix build sandbox (and a NixOS install) cannot
# find. On Windows these features are no-ops.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }

# The layout table's test compiles each layout with real XKB data.
[target.'cfg(unix)'.dev-dependencies]
xkbcommon.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
