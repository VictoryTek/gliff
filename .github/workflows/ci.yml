name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mbx clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: mbx test --workspace --locked

  release:
    needs: [fmt, clippy, test]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against Cargo.toml
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "gliff ${{ steps.version.outputs.version }}" \
            --generate-notes

  # The Windows viewer is the one crate that runs on Windows, with the
  # portable crates it uses.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy -p gliff-win --all-targets --locked -- -D warnings
      - run: cargo test -p gliff-proto -p gliff-transport -p gliff-sw -p gliff-win --locked

  windows-release:
    needs: [release, windows]
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release -p gliff-win --locked
      - name: Attach the viewer to the release
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $zip = "gliff-win-$version-x86_64-windows.zip"
          Compress-Archive -Path target\release\gliff-win.exe, LICENSE -DestinationPath $zip
          gh release upload $env:GITHUB_REF_NAME $zip --clobber
