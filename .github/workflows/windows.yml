# The Windows viewer (crates/vexdesk), kept in a file of its own so that
# upstream's changes to ci.yml never conflict with it.
#
# Every push and pull request lints and tests the viewer. Pushing a tag
# win-v<version> (for example win-v0.1.0) also builds vexdesk.exe and
# publishes it as a release, which scripts/winget-install.ps1 installs. These
# tags and versions are the fork's own: they do not touch the version in
# Cargo.toml or upstream's v* tags. The prefix must not start with "v":
# upstream's release job in ci.yml runs for every tag matching v* and fails on
# a tag that is not its version.
name: Windows viewer

on:
  push:
    branches: [main]
    tags: ["win-v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    # For the fork; upstream has no Windows viewer.
    if: github.repository != 'omacom/gliff'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo clippy -p vexdesk --all-targets --locked -- -D warnings
      - run: cargo test -p gliff-proto -p gliff-transport -p gliff-sw -p vexdesk --locked

  release:
    needs: windows
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release -p vexdesk --locked
      - name: Publish the viewer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^win-v', ''
          $zip = "vexdesk-$version-x86_64-windows.zip"
          Compress-Archive -Path target\release\vexdesk.exe, LICENSE -DestinationPath $zip
          gh release create $env:GITHUB_REF_NAME $zip --title "VexDesk $version" --generate-notes
